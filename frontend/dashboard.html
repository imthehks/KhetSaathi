<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard | KhetSaathi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Global Dynamic Navigation Bar -->
    <div id="main-nav-container"></div>

    <main class="py-4">
        <div class="container">
            <!-- Dynamic Role-Based Content Container -->
            <div id="dashboard-role-content">
                <div class="text-center py-5">
                    <div class="spinner-border text-success" role="status">
                        <span class="visually-hidden">Loading dashboard...</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Equipment Modal (For Equipment Owners & Admins) -->
    <div class="modal fade" id="addEquipmentModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold"><i class="bi bi-plus-circle me-2"></i>Add Equipment Listing</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="add-equipment-form" onsubmit="submitAddEquipmentForm(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Equipment Name</label>
                            <input type="text" class="form-control" id="add-equip-name" placeholder="e.g. Swaraj 744 FE Tractor (48 HP)" required>
                        </div>
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Category</label>
                                <select class="form-select" id="add-equip-category" required>
                                    <option value="Tractor">Tractor</option>
                                    <option value="Harvester">Harvester</option>
                                    <option value="Rotavator & Tillage">Rotavator & Tillage</option>
                                    <option value="Irrigation & Pumps">Irrigation & Pumps</option>
                                    <option value="Seeder & Planter">Seeder & Planter</option>
                                    <option value="Sprayer">Sprayer</option>
                                    <option value="Laser Land Leveler">Laser Land Leveler</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">Rental Rate (₹/Day)</label>
                                <input type="number" class="form-control" id="add-equip-rate" placeholder="1500" min="100" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">District / Village Location</label>
                            <input type="text" class="form-control" id="add-equip-location" placeholder="e.g. Ludhiana, Punjab" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Image URL (Optional)</label>
                            <input type="url" class="form-control" id="add-equip-image-url" placeholder="https://images.unsplash.com/...">
                            <div class="form-text small">Provide an image URL or leave blank to use default machinery image.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Detailed Description & Condition</label>
                            <textarea class="form-control" id="add-equip-desc" rows="3" placeholder="Condition of tires, PTO, implements included, fuel terms..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary-khet w-100 py-2">
                            Publish Listing
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            © 2026 KhetSaathi. Farm Equipment & Labor Sharing System.
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application JS -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

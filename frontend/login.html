<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | KhetSaathi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Global Dynamic Navigation Bar -->
    <div id="main-nav-container"></div>

    <main class="d-flex align-items-center py-5">
        <div class="container" style="max-width: 460px;">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="text-center mb-4">
                    <span class="fs-1">🌾</span>
                    <h3 class="fw-bold mt-2 mb-1">Welcome Back</h3>
                    <p class="text-muted small">Log in to your KhetSaathi agricultural portal</p>
                </div>

                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control border-start-0" id="login-email" placeholder="name@example.com" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control border-start-0" id="login-password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" id="btn-login" class="btn btn-primary-khet w-100 py-2 fw-bold">
                        Log In
                    </button>
                </form>

                <!-- Demo Account Quick Fill Buttons -->
                <div class="mt-4 pt-3 border-top">
                    <div class="text-center small text-muted mb-2 fw-bold">
                        ⚡ Quick 1-Click Demo Logins:
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <button class="btn btn-outline-success btn-sm w-100 py-2" onclick="quickFillLogin('farmer@khetsaathi.com', 'farmer123')">
                                <i class="bi bi-person me-1"></i> Farmer
                            </button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-outline-warning text-dark btn-sm w-100 py-2" onclick="quickFillLogin('owner@khetsaathi.com', 'owner123')">
                                <i class="bi bi-truck me-1"></i> Owner
                            </button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-outline-info text-dark btn-sm w-100 py-2" onclick="quickFillLogin('laborer@khetsaathi.com', 'labor123')">
                                <i class="bi bi-people me-1"></i> Laborer
                            </button>
                        </div>
                        <div class="col-6">
                            <button class="btn btn-outline-danger btn-sm w-100 py-2" onclick="quickFillLogin('admin@khetsaathi.com', 'admin123')">
                                <i class="bi bi-shield-lock me-1"></i> Admin
                            </button>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4 pt-2 small text-muted">
                    Don't have an account? <a href="register.html" class="text-success fw-bold text-decoration-none">Sign up here</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application JS -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

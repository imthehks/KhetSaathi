<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skilled Farm Labor | KhetSaathi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Global Dynamic Navigation Bar -->
    <div id="main-nav-container"></div>

    <main class="py-4">
        <div class="container">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                <div>
                    <h2 class="fw-bold mb-1">Skilled Agricultural Labor</h2>
                    <p class="text-muted small mb-0">Hire verified tractor operators, sowing specialists, and harvesting crews on daily wages.</p>
                </div>
                <a href="register.html" class="btn btn-outline-khet btn-sm">
                    <i class="bi bi-person-plus me-1"></i> Join as Farm Laborer
                </a>
            </div>

            <!-- Filter Panel -->
            <div class="card border-0 shadow-sm rounded-3 mb-4">
                <div class="card-body p-3">
                    <form id="labor-search-form" class="row g-2 align-items-center">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted mb-1">Keyword / Name</label>
                            <input type="text" class="form-control form-control-sm" id="search-labor-query" placeholder="e.g. Driver, Harvester, Sunita">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold text-muted mb-1">Skill Type</label>
                            <select class="form-select form-select-sm" id="filter-skill">
                                <option value="">All Skills</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold text-muted mb-1">District / Location</label>
                            <input type="text" class="form-control form-control-sm" id="filter-labor-location" placeholder="e.g. Meerut, Patna">
                        </div>
                        <div class="col-md-2">
                            <label class="form-label small fw-bold text-muted mb-1">Max Daily Wage (₹)</label>
                            <input type="number" class="form-control form-control-sm" id="filter-max-wage" placeholder="e.g. 800">
                        </div>
                        <div class="col-md-2 d-flex flex-column justify-content-end">
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="checkbox" id="filter-labor-available" checked>
                                <label class="form-check-label small" for="filter-labor-available">Available Only</label>
                            </div>
                            <div class="d-flex gap-1">
                                <button type="submit" class="btn btn-primary-khet btn-sm w-100">Apply</button>
                                <button type="button" id="btn-reset-labor-filters" class="btn btn-outline-secondary btn-sm" title="Reset Filters"><i class="bi bi-arrow-counterclockwise"></i></button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Labor Grid -->
            <div class="row" id="labor-list-container">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-success" role="status"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Hiring Modal Template -->
    <div class="modal fade" id="bookingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title fw-bold" id="bookingModalTitle">Hire Farm Labor</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3 p-3 bg-light rounded-3 border">
                        <h6 class="fw-bold mb-1 text-truncate" id="booking-item-name">-</h6>
                        <div class="d-flex justify-content-between text-muted small">
                            <span>Daily Wage: <strong class="text-success" id="booking-item-rate">-</strong></span>
                            <span>Location: <span id="booking-item-location">-</span></span>
                        </div>
                    </div>
                    <form id="booking-form" onsubmit="event.preventDefault(); submitBookingForm();">
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Work Start Date</label>
                                <input type="date" class="form-control" id="booking-start-date" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">Work End Date</label>
                                <input type="date" class="form-control" id="booking-end-date" required>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center p-3 mb-3 bg-success bg-opacity-10 rounded-3 border border-success border-opacity-25">
                            <div>
                                <div class="text-muted small">Total Days</div>
                                <div class="fw-bold text-dark" id="booking-calculated-days">2 Day(s)</div>
                            </div>
                            <div class="text-end">
                                <div class="text-muted small">Estimated Wage Total</div>
                                <div class="fs-4 fw-bold text-success" id="booking-calculated-total">₹0.00</div>
                            </div>
                        </div>
                        <button type="submit" id="btn-confirm-booking" class="btn btn-primary-khet w-100 py-2">
                            Confirm Hire Request
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            © 2026 KhetSaathi. Farm Equipment & Labor Sharing System.
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Razorpay Checkout Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <!-- Core Application JS -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

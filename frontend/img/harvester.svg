<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_harvester" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081c15" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Field Grid -->
  <rect width="800" height="500" fill="url(#grad_harvester)" />
  
  <!-- Stylized Sun & Field Horizon -->
  <circle cx="680" cy="120" r="80" fill="#ffffff" opacity="0.08" />
  <circle cx="680" cy="120" r="50" fill="#ffffff" opacity="0.12" />
  
  <!-- Soil / Field Contours -->
  <path d="M 0 380 Q 200 350 400 375 T 800 360 L 800 500 L 0 500 Z" fill="#1b2e23" opacity="0.85" />
  <path d="M 0 410 Q 250 390 500 405 T 800 395 L 800 500 L 0 500 Z" fill="#122018" />

  <!-- Agricultural Furrow Rows -->
  <line x1="0" y1="440" x2="800" y2="430" stroke="#2d4a37" stroke-width="2" stroke-dasharray="12,8" opacity="0.6" />
  <line x1="0" y1="470" x2="800" y2="460" stroke="#2d4a37" stroke-width="3" stroke-dasharray="15,10" opacity="0.6" />

  <!-- Central Illustrated Machinery Graphics -->
  <g transform="translate(160, 80)" filter="url(#shadow)">
    
  <!-- Harvester Giant Body -->
  <rect x="130" y="40" width="240" height="125" rx="12" fill="#007200" />
  <polygon points="130,40 180,0 350,0 370,40" fill="#38b000" />
  <!-- Driver Cabin Glass -->
  <path d="M 320 40 L 370 40 L 360 100 L 310 100 Z" fill="#70e000" opacity="0.5" stroke="#ffffff" stroke-width="2" />
  <!-- Discharge Auger Pipe -->
  <line x1="180" y1="30" x2="70" y2="10" stroke="#ffd166" stroke-width="16" stroke-linecap="round" />
  <!-- Front Cutter Reel -->
  <rect x="350" y="110" width="70" height="55" rx="6" fill="#cc5500" />
  <circle cx="420" cy="145" r="35" fill="none" stroke="#ffd166" stroke-width="8" stroke-dasharray="14,8" />
  <circle cx="420" cy="145" r="12" fill="#111111" />
  <!-- Heavy Drive Wheels -->
  <circle cx="200" cy="180" r="55" fill="#1b262c" />
  <circle cx="200" cy="180" r="34" fill="#ffd166" />
  <circle cx="320" cy="190" r="36" fill="#1b262c" />
  <circle cx="320" cy="190" r="20" fill="#ffd166" />

  </g>

  <!-- Technical Spec & Model Caption Ribbon -->
  <rect x="30" y="30" width="280" height="44" rx="8" fill="#000000" fill-opacity="0.4" />
  <circle cx="52" cy="52" r="8" fill="#ffd166" />
  <text x="70" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Combine Harvester</text>

  <!-- Bottom Spec Banner -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#ffffff" fill-opacity="0.12" />
  <text x="50" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🚜 SPECS: 14ft Cutter Bar • Wheat, Paddy, Soybean • Low Grain Loss</text>
  <text x="750" y="460" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffd166">KhetSaathi Certified</text>
</svg>
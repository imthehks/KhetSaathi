<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_laser_leveler" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e0b" />
      <stop offset="100%" stop-color="#1d3824" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Field Grid -->
  <rect width="800" height="500" fill="url(#grad_laser_leveler)" />
  
  <!-- Stylized Sun & Field Horizon -->
  <circle cx="680" cy="120" r="80" fill="#ffffff" opacity="0.08" />
  <circle cx="680" cy="120" r="50" fill="#ffffff" opacity="0.12" />
  
  <!-- Soil / Field Contours -->
  <path d="M 0 380 Q 200 350 400 375 T 800 360 L 800 500 L 0 500 Z" fill="#1b2e23" opacity="0.85" />
  <path d="M 0 410 Q 250 390 500 405 T 800 395 L 800 500 L 0 500 Z" fill="#122018" />

  <!-- Agricultural Furrow Rows -->
  <line x1="0" y1="440" x2="800" y2="430" stroke="#2d4a37" stroke-width="2" stroke-dasharray="12,8" opacity="0.6" />
  <line x1="0" y1="470" x2="800" y2="460" stroke="#2d4a37" stroke-width="3" stroke-dasharray="15,10" opacity="0.6" />

  <!-- Central Illustrated Machinery Graphics -->
  <g transform="translate(160, 80)" filter="url(#shadow)">
    
  <!-- Rotary Laser Transmitter on Tripod -->
  <polygon points="120,40 140,40 135,15 125,15" fill="#ffd166" />
  <circle cx="130" cy="28" r="6" fill="#d90429" />
  <!-- Laser Beam Line -->
  <line x1="135" y1="28" x2="440" y2="28" stroke="#ff0054" stroke-width="3" stroke-dasharray="10,6" />
  <!-- Tripod Legs -->
  <line x1="130" y1="40" x2="90" y2="160" stroke="#ffd166" stroke-width="6" />
  <line x1="130" y1="40" x2="170" y2="160" stroke="#ffd166" stroke-width="6" />
  <!-- Hydraulic Bucket Scraper Unit -->
  <rect x="290" y="80" width="120" height="60" rx="8" fill="#ffd166" stroke="#222222" stroke-width="4" />
  <!-- Receiver Mast -->
  <line x1="350" y1="80" x2="350" y2="20" stroke="#222222" stroke-width="6" />
  <rect x="340" y="20" width="20" height="20" rx="3" fill="#d90429" />
  <!-- Wheels -->
  <circle cx="320" cy="160" r="26" fill="#222222" />
  <circle cx="380" cy="160" r="26" fill="#222222" />

  </g>

  <!-- Technical Spec & Model Caption Ribbon -->
  <rect x="30" y="30" width="280" height="44" rx="8" fill="#000000" fill-opacity="0.4" />
  <circle cx="52" cy="52" r="8" fill="#ffd166" />
  <text x="70" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Laser Land Leveler</text>

  <!-- Bottom Spec Banner -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#ffffff" fill-opacity="0.12" />
  <text x="50" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🚜 SPECS: Dual-Slope Laser Guide • 30% Irrigation Water Savings</text>
  <text x="750" y="460" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ffd166">KhetSaathi Certified</text>
</svg>
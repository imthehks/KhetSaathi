<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_drone_sprayer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b4332" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Field Grid -->
  <rect width="800" height="500" fill="url(#grad_drone_sprayer)" />
  
  <!-- Stylized Sun & Field Horizon -->
  <circle cx="680" cy="120" r="80" fill="#ffffff" opacity="0.08" />
  <circle cx="680" cy="120" r="50" fill="#ffffff" opacity="0.12" />
  
  <!-- Soil / Field Contours -->
  <path d="M 0 380 Q 200 350 400 375 T 800 360 L 800 500 L 0 500 Z" fill="#1b2e23" opacity="0.85" />
  <path d="M 0 410 Q 250 390 500 405 T 800 395 L 800 500 L 0 500 Z" fill="#122018" />

  <!-- Agricultural Furrow Rows -->
  <line x1="0" y1="440" x2="800" y2="430" stroke="#2d4a37" stroke-width="2" stroke-dasharray="12,8" opacity="0.6" />
  <line x1="0" y1="470" x2="800" y2="460" stroke="#2d4a37" stroke-width="3" stroke-dasharray="15,10" opacity="0.6" />

  <!-- Central Illustrated Machinery Graphics -->
  <g transform="translate(160, 80)" filter="url(#shadow)">
    
  <!-- Hexacopter Drone Arms -->
  <line x1="130" y1="60" x2="350" y2="160" stroke="#343a40" stroke-width="8" />
  <line x1="130" y1="160" x2="350" y2="60" stroke="#343a40" stroke-width="8" />
  <line x1="110" y1="110" x2="370" y2="110" stroke="#343a40" stroke-width="8" />
  <!-- Rotor Motors & Propellers -->
  <ellipse cx="130" cy="60" rx="35" ry="6" fill="#ffffff" opacity="0.7" />
  <ellipse cx="350" cy="60" rx="35" ry="6" fill="#ffffff" opacity="0.7" />
  <ellipse cx="130" cy="160" rx="35" ry="6" fill="#ffffff" opacity="0.7" />
  <ellipse cx="350" cy="160" rx="35" ry="6" fill="#ffffff" opacity="0.7" />
  <ellipse cx="110" cy="110" rx="35" ry="6" fill="#ffffff" opacity="0.7" />
  <ellipse cx="370" cy="110" rx="35" ry="6" fill="#ffffff" opacity="0.7" />
  <!-- Central Hull & Liquid Tank -->
  <ellipse cx="240" cy="110" rx="45" ry="35" fill="#ffffff" stroke="#2b2d42" stroke-width="4" />
  <rect x="220" y="90" width="40" height="40" rx="8" fill="#0077b6" />
  <!-- Spraying Atomizer Mist -->
  <path d="M 180 160 L 160 210" stroke="#90e0ef" stroke-width="4" stroke-dasharray="4,3" />
  <path d="M 240 160 L 240 215" stroke="#90e0ef" stroke-width="4" stroke-dasharray="4,3" />
  <path d="M 300 160 L 320 210" stroke="#90e0ef" stroke-width="4" stroke-dasharray="4,3" />

  </g>

  <!-- Technical Spec & Model Caption Ribbon -->
  <rect x="30" y="30" width="280" height="44" rx="8" fill="#000000" fill-opacity="0.4" />
  <circle cx="52" cy="52" r="8" fill="#00b4d8" />
  <text x="70" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Agri-Spraying Drone</text>

  <!-- Bottom Spec Banner -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#ffffff" fill-opacity="0.12" />
  <text x="50" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🚜 SPECS: 10L Chemical Tank • 1 Acre in 7 Mins • GPS Auto-Flight</text>
  <text x="750" y="460" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00b4d8">KhetSaathi Certified</text>
</svg>
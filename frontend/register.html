<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | KhetSaathi</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <!-- Global Dynamic Navigation Bar -->
    <div id="main-nav-container"></div>

    <main class="py-5">
        <div class="container" style="max-width: 580px;">
            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="text-center mb-4">
                    <span class="fs-1">🌾</span>
                    <h3 class="fw-bold mt-2 mb-1">Create an Account</h3>
                    <p class="text-muted small">Join KhetSaathi to rent, lend, or provide farm labor</p>
                </div>

                <!-- Role Selection Cards -->
                <label class="form-label small fw-bold mb-2">Select Your Primary Role</label>
                <div class="row g-2 mb-4">
                    <div class="col-4">
                        <div class="card role-select-card text-center p-2 border border-2 border-success bg-light h-100 cursor-pointer" data-role="farmer" style="cursor: pointer;">
                            <div class="fs-3 mb-1">👨‍🌾</div>
                            <div class="fw-bold small">Farmer</div>
                            <div class="text-muted" style="font-size: 0.7rem;">Rent Tools & Labor</div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card role-select-card text-center p-2 border border-2 h-100 cursor-pointer" data-role="owner" style="cursor: pointer;">
                            <div class="fs-3 mb-1">🚜</div>
                            <div class="fw-bold small">Owner</div>
                            <div class="text-muted" style="font-size: 0.7rem;">List Machinery</div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card role-select-card text-center p-2 border border-2 h-100 cursor-pointer" data-role="laborer" style="cursor: pointer;">
                            <div class="fs-3 mb-1">👷</div>
                            <div class="fw-bold small">Laborer</div>
                            <div class="text-muted" style="font-size: 0.7rem;">Work & Earn</div>
                        </div>
                    </div>
                </div>

                <form id="register-form">
                    <input type="hidden" id="register-role" value="farmer">
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" class="form-control" id="reg-name" placeholder="e.g. Ramesh Kumar" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="email" class="form-control" id="reg-email" placeholder="ramesh@example.com" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Mobile Phone</label>
                            <input type="tel" class="form-control" id="reg-phone" placeholder="+91 98765 43210" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password (min 6 characters)</label>
                        <input type="password" class="form-control" id="reg-password" minlength="6" placeholder="••••••••" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-bold">Village / District & State</label>
                        <input type="text" class="form-control" id="reg-address" placeholder="e.g. Taraori, Karnal, Haryana" required>
                    </div>

                    <button type="submit" id="btn-register" class="btn btn-primary-khet w-100 py-2 fw-bold mt-2">
                        Create Account
                    </button>
                </form>

                <div class="text-center mt-4 pt-2 small text-muted">
                    Already registered? <a href="login.html" class="text-success fw-bold text-decoration-none">Log in here</a>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Application JS -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>

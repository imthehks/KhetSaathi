<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_rotavator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#21090d" />
      <stop offset="100%" stop-color="#1c382b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Field Grid -->
  <rect width="800" height="500" fill="url(#grad_rotavator)" />
  
  <!-- Stylized Sun & Field Horizon -->
  <circle cx="680" cy="120" r="80" fill="#ffffff" opacity="0.08" />
  <circle cx="680" cy="120" r="50" fill="#ffffff" opacity="0.12" />
  
  <!-- Soil / Field Contours -->
  <path d="M 0 380 Q 200 350 400 375 T 800 360 L 800 500 L 0 500 Z" fill="#1b2e23" opacity="0.85" />
  <path d="M 0 410 Q 250 390 500 405 T 800 395 L 800 500 L 0 500 Z" fill="#122018" />

  <!-- Agricultural Furrow Rows -->
  <line x1="0" y1="440" x2="800" y2="430" stroke="#2d4a37" stroke-width="2" stroke-dasharray="12,8" opacity="0.6" />
  <line x1="0" y1="470" x2="800" y2="460" stroke="#2d4a37" stroke-width="3" stroke-dasharray="15,10" opacity="0.6" />

  <!-- Central Illustrated Machinery Graphics -->
  <g transform="translate(160, 80)" filter="url(#shadow)">
    
  <!-- Main Frame & Linkage -->
  <rect x="100" y="70" width="280" height="35" rx="6" fill="#d90429" />
  <polygon points="210,70 240,20 270,70" fill="#2b2d42" stroke="#8d99ae" stroke-width="4" />
  <!-- Central Gearbox -->
  <rect x="215" y="60" width="50" height="55" rx="8" fill="#2b2d42" />
  <circle cx="240" cy="85" r="12" fill="#ef233c" />
  <!-- Rotary Shaft & Blades -->
  <rect x="110" y="130" width="260" height="14" fill="#495057" />
  <!-- Curved Flange Blades -->
  <path d="M 130 130 C 120 180, 150 200, 160 190" stroke="#e5e5e5" stroke-width="8" fill="none" />
  <path d="M 180 130 C 170 180, 200 200, 210 190" stroke="#e5e5e5" stroke-width="8" fill="none" />
  <path d="M 230 130 C 220 180, 250 200, 260 190" stroke="#e5e5e5" stroke-width="8" fill="none" />
  <path d="M 280 130 C 270 180, 300 200, 310 190" stroke="#e5e5e5" stroke-width="8" fill="none" />
  <path d="M 330 130 C 320 180, 350 200, 360 190" stroke="#e5e5e5" stroke-width="8" fill="none" />
  <!-- Side Protective Hood -->
  <path d="M 90 75 Q 80 160 110 170" stroke="#d90429" stroke-width="12" fill="none" />
  <path d="M 390 75 Q 400 160 370 170" stroke="#d90429" stroke-width="12" fill="none" />

  </g>

  <!-- Technical Spec & Model Caption Ribbon -->
  <rect x="30" y="30" width="280" height="44" rx="8" fill="#000000" fill-opacity="0.4" />
  <circle cx="52" cy="52" r="8" fill="#ef233c" />
  <text x="70" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Rotavator & Soil Tiller</text>

  <!-- Bottom Spec Banner -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#ffffff" fill-opacity="0.12" />
  <text x="50" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🚜 SPECS: 7-Feet Working Width • Boron Steel L-Blades • 1-Pass Seedbed</text>
  <text x="750" y="460" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#ef233c">KhetSaathi Certified</text>
</svg>
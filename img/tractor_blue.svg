<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_tractor_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#152e2a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Field Grid -->
  <rect width="800" height="500" fill="url(#grad_tractor_blue)" />
  
  <!-- Stylized Sun & Field Horizon -->
  <circle cx="680" cy="120" r="80" fill="#ffffff" opacity="0.08" />
  <circle cx="680" cy="120" r="50" fill="#ffffff" opacity="0.12" />
  
  <!-- Soil / Field Contours -->
  <path d="M 0 380 Q 200 350 400 375 T 800 360 L 800 500 L 0 500 Z" fill="#1b2e23" opacity="0.85" />
  <path d="M 0 410 Q 250 390 500 405 T 800 395 L 800 500 L 0 500 Z" fill="#122018" />

  <!-- Agricultural Furrow Rows -->
  <line x1="0" y1="440" x2="800" y2="430" stroke="#2d4a37" stroke-width="2" stroke-dasharray="12,8" opacity="0.6" />
  <line x1="0" y1="470" x2="800" y2="460" stroke="#2d4a37" stroke-width="3" stroke-dasharray="15,10" opacity="0.6" />

  <!-- Central Illustrated Machinery Graphics -->
  <g transform="translate(160, 80)" filter="url(#shadow)">
    
  <rect x="110" y="90" width="180" height="75" rx="10" fill="#1d3557" />
  <rect x="160" y="45" width="120" height="55" rx="6" fill="#1d3557" />
  <rect x="70" y="0" width="180" height="12" rx="4" fill="#f1faee" />
  <line x1="90" y1="12" x2="100" y2="130" stroke="#457b9d" stroke-width="6" />
  <line x1="230" y1="12" x2="210" y2="130" stroke="#457b9d" stroke-width="6" />
  <path d="M 280 90 L 355 100 L 355 155 L 280 160 Z" fill="#457b9d" />
  <rect x="350" y="108" width="10" height="42" rx="3" fill="#f1faee" />
  <rect x="295" y="30" width="12" height="65" fill="#111111" />
  <circle cx="110" cy="170" r="65" fill="#1b262c" />
  <circle cx="110" cy="170" r="42" fill="#f1faee" />
  <circle cx="110" cy="170" r="18" fill="#1d3557" />
  <circle cx="325" cy="185" r="40" fill="#1b262c" />
  <circle cx="325" cy="185" r="25" fill="#f1faee" />
  <circle cx="325" cy="185" r="10" fill="#1d3557" />
  <circle cx="355" cy="115" r="9" fill="#fff3b0" />
  <rect x="295" y="118" width="45" height="14" rx="3" fill="#ffffff" />
  <text x="317" y="128" font-family="sans-serif" font-size="9" font-weight="bold" fill="#1d3557" text-anchor="middle">52 HP</text>

  </g>

  <!-- Technical Spec & Model Caption Ribbon -->
  <rect x="30" y="30" width="280" height="44" rx="8" fill="#000000" fill-opacity="0.4" />
  <circle cx="52" cy="52" r="8" fill="#a8dadc" />
  <text x="70" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Swaraj 855 FE Tractor</text>

  <!-- Bottom Spec Banner -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#ffffff" fill-opacity="0.12" />
  <text x="50" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🚜 SPECS: 52 HP 3-Cylinder • Reverse PTO • High Fuel Efficiency</text>
  <text x="750" y="460" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#a8dadc">KhetSaathi Certified</text>
</svg>
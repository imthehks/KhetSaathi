<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_solar_pump" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1d28" />
      <stop offset="100%" stop-color="#123c28" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Field Grid -->
  <rect width="800" height="500" fill="url(#grad_solar_pump)" />
  
  <!-- Stylized Sun & Field Horizon -->
  <circle cx="680" cy="120" r="80" fill="#ffffff" opacity="0.08" />
  <circle cx="680" cy="120" r="50" fill="#ffffff" opacity="0.12" />
  
  <!-- Soil / Field Contours -->
  <path d="M 0 380 Q 200 350 400 375 T 800 360 L 800 500 L 0 500 Z" fill="#1b2e23" opacity="0.85" />
  <path d="M 0 410 Q 250 390 500 405 T 800 395 L 800 500 L 0 500 Z" fill="#122018" />

  <!-- Agricultural Furrow Rows -->
  <line x1="0" y1="440" x2="800" y2="430" stroke="#2d4a37" stroke-width="2" stroke-dasharray="12,8" opacity="0.6" />
  <line x1="0" y1="470" x2="800" y2="460" stroke="#2d4a37" stroke-width="3" stroke-dasharray="15,10" opacity="0.6" />

  <!-- Central Illustrated Machinery Graphics -->
  <g transform="translate(160, 80)" filter="url(#shadow)">
    
  <!-- Solar Panel Array -->
  <polygon points="60,40 180,10 240,60 120,90" fill="#1e3d59" stroke="#f5f0e1" stroke-width="3" />
  <line x1="120" y1="25" x2="180" y2="75" stroke="#438a5e" stroke-width="2" />
  <line x1="90" y1="65" x2="210" y2="35" stroke="#438a5e" stroke-width="2" />
  <!-- Panel Stand -->
  <line x1="150" y1="75" x2="150" y2="160" stroke="#6c757d" stroke-width="8" />
  <line x1="120" y1="160" x2="180" y2="160" stroke="#6c757d" stroke-width="8" />
  <!-- Pump Inverter Controller -->
  <rect x="220" y="90" width="50" height="70" rx="6" fill="#f5f0e1" stroke="#333333" stroke-width="3" />
  <circle cx="245" cy="115" r="8" fill="#28a745" />
  <!-- Pump Motor Unit -->
  <rect x="320" y="110" width="80" height="55" rx="10" fill="#17a2b8" />
  <circle cx="360" cy="137" r="16" fill="#343a40" />
  <!-- Water Delivery Fountain Pipe -->
  <path d="M 370 110 L 370 60 Q 370 40 400 40 L 420 40" stroke="#0077b6" stroke-width="16" fill="none" />
  <!-- Water Streams -->
  <path d="M 425 40 Q 450 45 470 90" stroke="#90e0ef" stroke-width="8" fill="none" stroke-dasharray="6,4" />
  <path d="M 425 40 Q 460 55 465 110" stroke="#48cae4" stroke-width="6" fill="none" stroke-dasharray="8,6" />

  </g>

  <!-- Technical Spec & Model Caption Ribbon -->
  <rect x="30" y="30" width="280" height="44" rx="8" fill="#000000" fill-opacity="0.4" />
  <circle cx="52" cy="52" r="8" fill="#00b4d8" />
  <text x="70" y="57" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">5HP Solar Water Pump</text>

  <!-- Bottom Spec Banner -->
  <rect x="30" y="435" width="740" height="40" rx="6" fill="#ffffff" fill-opacity="0.12" />
  <text x="50" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0">🚜 SPECS: 5 HP Submersible • High Discharge 50,000 L/hr • Zero Fuel Cost</text>
  <text x="750" y="460" text-anchor="end" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="bold" fill="#00b4d8">KhetSaathi Certified</text>
</svg>